# Alternativa com Nginx (use apenas se o servidor não usar Caddy).
# Certificado: sudo certbot --nginx -d mapa.noc.updown.com.br
server {
    listen 80;
    server_name mapa.noc.updown.com.br;
    root /opt/mapaprov/public;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; child-src 'self' blob:; img-src 'self' data: blob: https://tile.googleapis.com https://tiles.openfreemap.org https://server.arcgisonline.com https://s3.amazonaws.com; connect-src 'self' https://tile.googleapis.com https://graph.mapillary.com https://tiles.openfreemap.org https://server.arcgisonline.com https://s3.amazonaws.com https://overpass-api.de https://servicodados.ibge.gov.br https://nominatim.openstreetmap.org; font-src 'self'; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location /vendor/ { expires 7d; }
    location ~ \.wasm$ { types { application/wasm wasm; } expires 7d; }
    location = /config.json { expires -1; }
    location ~* \.(js|css|html)$ { expires -1; }
    location / { try_files $uri $uri/ =404; }
}
