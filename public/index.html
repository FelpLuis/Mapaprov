<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiber 3D · Cubatão</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="vendor/mapillary.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="brand"><span class="logo">◆</span> Fiber 3D <small>Projetista FTTH · Cubatão/SP</small></div>
      <div class="search">
        <input id="search" type="search" placeholder="Buscar endereço, rua ou elemento em Cubatão…" autocomplete="off">
        <div id="search-results"></div>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="btn-undo" title="Desfazer (Ctrl+Z)">↶</button>
        <button class="btn ghost" id="btn-redo" title="Refazer (Ctrl+Y)">↷</button>
        <button class="btn ghost" id="btn-real" title="Visual realista: satélite + prédios 3D + relevo (grátis)">Realista</button>
        <button class="btn ghost" id="btn-sv" title="Street View (S)">Street View</button>
        <button class="btn ghost" id="btn-view" title="Alternar 2D / 3D">3D</button>
      </div>
    </header>

    <aside id="left">
      <nav class="tabs" id="tabs">
        <button data-tab="tools" class="active">Ferramentas</button>
        <button data-tab="layers">Camadas</button>
        <button data-tab="project">Projeto</button>
        <button data-tab="list">Lista</button>
        <button data-tab="bom">Materiais</button>
      </nav>
      <div class="tab-body" id="tab-body"></div>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>
      <div id="banner" hidden></div>
      <div id="status"></div>
      <div id="g-credits" hidden></div>
      <div id="sv" hidden>
        <div class="sv-head"><b>Foto da rua</b><span id="sv-title" class="muted"></span>
          <button class="btn xs" id="sv-google" title="Abrir o Street View do Google numa janela ao lado (grátis)">Google Street View</button>
          <button class="btn xs" id="sv-close" title="Fechar">✕</button></div>
        <div id="sv-mly" hidden></div>
        <iframe id="sv-frame" title="Google Street View" referrerpolicy="no-referrer-when-downgrade" allowfullscreen loading="lazy"></iframe>
      </div>
    </main>

    <aside id="right" hidden>
      <div class="panel-head"><h3 id="props-title">Propriedades</h3><button class="btn ghost" id="props-close" title="Fechar">✕</button></div>
      <div id="props"></div>
    </aside>
  </div>

  <script src="vendor/maplibre-gl-csp.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
